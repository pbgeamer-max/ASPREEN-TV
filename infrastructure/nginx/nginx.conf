worker_processes auto;
events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    upstream web_upstream {
        server web:3000;
    }

    upstream api_upstream {
        server api:3001;
    }

    server {
        listen 80;
        server_name _;

        # Internal auth subrequest endpoint for Nginx auth_request
        location = /internal/auth-hls {
            internal;
            proxy_pass http://api_upstream/api/hls-auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Protected HLS Stream Delivery Layer
        # Protects both .m3u8 playlist files and all .ts video segments!
        location /hls/ {
            auth_request /internal/auth-hls;

            # Rewrite /hls/{outputId}/{token}/{file} to map directly to storage directory
            rewrite ^/hls/([a-zA-Z0-9_\-]+)/[a-fA-F0-9]{32,64}/(.+)$ /$1/$2 break;
            root /var/www/aspreen/hls;

            # CORS headers for playback in Android players and authorized web applications
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Range, Origin, Accept" always;

            # Cache headers tailored for live HLS streaming
            location ~ \.m3u8$ {
                types {
                    application/vnd.apple.mpegurl m3u8;
                }
                add_header Cache-Control "no-cache, no-store, must-revalidate" always;
                add_header Access-Control-Allow-Origin * always;
            }

            location ~ \.ts$ {
                types {
                    video/mp2t ts;
                }
                add_header Cache-Control "public, max-age=86400" always;
                add_header Access-Control-Allow-Origin * always;
            }
        }

        # Backend API Proxy
        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://api_upstream/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend Next.js Web Application
        location / {
            proxy_pass http://web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
