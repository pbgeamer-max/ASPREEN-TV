version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: aspreen-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/hls:/var/www/aspreen/hls:ro
    depends_on:
      - web
      - api
    networks:
      - aspreen-net

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    container_name: aspreen-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost/api
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - NEXT_PUBLIC_FIREBASE_API_KEY=${FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${FIREBASE_AUTH_DOMAIN}
    networks:
      - aspreen-net

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    container_name: aspreen-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - WEB_BASE_URL=http://localhost
      - API_BASE_URL=http://localhost/api
      - PUBLIC_STREAM_BASE_URL=${PUBLIC_STREAM_BASE_URL:-http://localhost}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - ADMIN_AUTHORIZED_UIDS=${ADMIN_AUTHORIZED_UIDS}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - STREAM_TOKEN_SECRET=${STREAM_TOKEN_SECRET}
      - STREAM_STORAGE_PATH=/var/www/aspreen/hls
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-8}
      - MAX_PLAYLIST_CHANNELS=${MAX_PLAYLIST_CHANNELS:-1000}
      - SOURCE_TIMEOUT_SECONDS=${SOURCE_TIMEOUT_SECONDS:-15}
    volumes:
      - ./data/hls:/var/www/aspreen/hls
    networks:
      - aspreen-net

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    container_name: aspreen-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - STREAM_STORAGE_PATH=/var/www/aspreen/hls
    volumes:
      - ./data/hls:/var/www/aspreen/hls
    networks:
      - aspreen-net

networks:
  aspreen-net:
    driver: bridge
